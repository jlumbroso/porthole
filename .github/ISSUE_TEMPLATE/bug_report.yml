name: Something does not work
description: A window did not open, opened wrongly, or a command misbehaved
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. porthole depends on an internal VS Code command, so the most useful facts are your VS Code version and what the **Porthole** output channel says (View, Output, choose "Porthole").
        The latest VS Code release is the one officially supported, so the first reply may be "can you update to the latest version?"
  - type: input
    id: vscode
    attributes:
      label: VS Code version
      description: Output of `code --version`, or Code, About Visual Studio Code
      placeholder: "1.141.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Only macOS has been tested so far
      placeholder: macOS 15 on Apple Silicon
    validations:
      required: true
  - type: input
    id: porthole
    attributes:
      label: porthole version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: checkboxes
    id: latest
    attributes:
      label: Does it happen on the latest VS Code release?
      options:
        - label: I tried the latest release, or I cannot update and say why below
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output channel "Porthole"
      description: Paste what it says. It states when the fallback ran. Nothing in it should be sensitive, but check.
      render: text
